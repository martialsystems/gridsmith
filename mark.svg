  Copyright (c) 2026 Martial Systems LLC. All rights reserved.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Gridsmith">
  <rect width="320" height="80" fill="none"/>
  <g transform="translate(4,8)" shape-rendering="crispEdges">
  <!-- full-bleed 4×4 retro palette (cell 16) -->
  <rect x="0"  y="0"  width="16" height="16" fill="#1d2b53"/>
  <rect x="16" y="0"  width="16" height="16" fill="#29adff"/>
  <rect x="32" y="0"  width="16" height="16" fill="#008751"/>
  <rect x="48" y="0"  width="16" height="16" fill="#00e436"/>

  <rect x="0"  y="16" width="16" height="16" fill="#7e2553"/>
  <rect x="16" y="16" width="16" height="16" fill="#ff004d"/>
  <rect x="32" y="16" width="16" height="16" fill="#ab5236"/>
  <rect x="48" y="16" width="16" height="16" fill="#ffa300"/>

  <rect x="0"  y="32" width="16" height="16" fill="#5f574f"/>
  <rect x="16" y="32" width="16" height="16" fill="#c2c3c7"/>
  <rect x="32" y="32" width="16" height="16" fill="#ffec27"/>
  <rect x="48" y="32" width="16" height="16" fill="#fff1e8"/>

  <rect x="0"  y="48" width="16" height="16" fill="#83769c"/>
  <rect x="16" y="48" width="16" height="16" fill="#ff77a8"/>
  <rect x="32" y="48" width="16" height="16" fill="#ffccaa"/>
  <rect x="48" y="48" width="16" height="16" fill="#000000"/>

  <!-- subtle grid seams so cells read as a palette -->
  <g fill="#0a0a0b" opacity="0.35">
    <rect x="16" y="0" width="1" height="64"/>
    <rect x="32" y="0" width="1" height="64"/>
    <rect x="48" y="0" width="1" height="64"/>
    <rect x="0" y="16" width="64" height="1"/>
    <rect x="0" y="32" width="64" height="1"/>
    <rect x="0" y="48" width="64" height="1"/>
  </g>

  <!-- active paint cell (default Gridsmith pink) — light frame only -->
  <rect x="16" y="16" width="16" height="16" fill="none" stroke="#fff1e8" stroke-width="2"/>

  <!--
    Forge hammer as a clear overlay over mid palette:
    dark silhouette first (reads on every swatch), then steel / wood fill.
  -->
  <!-- head silhouette -->
  <rect x="26" y="28" width="30" height="12" fill="#0a0a0b"/>
  <!-- head body -->
  <rect x="28" y="30" width="26" height="8" fill="#e8e8ec"/>
  <!-- head highlight + peen -->
  <rect x="29" y="31" width="20" height="3" fill="#ffffff"/>
  <rect x="48" y="31" width="5" height="6" fill="#9a9aa3"/>
  <!-- neck silhouette + fill -->
  <rect x="36" y="40" width="8" height="5" fill="#0a0a0b"/>
  <rect x="37" y="40" width="6" height="4" fill="#5f574f"/>
  <!-- handle silhouette + fill (sits on yellow / peach, not black cell) -->
  <rect x="36" y="44" width="8" height="14" fill="#0a0a0b"/>
  <rect x="37" y="44" width="6" height="12" fill="#c2643a"/>
  <!-- pommel -->
  <rect x="35" y="56" width="10" height="4" fill="#0a0a0b"/>
  <rect x="36" y="57" width="8" height="2" fill="#5f574f"/>

  <!-- strike sparks on the active pink (outlined) -->
  <rect x="20" y="20" width="4" height="4" fill="#0a0a0b"/>
  <rect x="21" y="21" width="2" height="2" fill="#ffec27"/>
  <rect x="24" y="16" width="4" height="4" fill="#0a0a0b"/>
  <rect x="25" y="17" width="2" height="2" fill="#ffa300"/>
  <rect x="16" y="24" width="4" height="4" fill="#0a0a0b"/>
  <rect x="17" y="25" width="2" height="2" fill="#fff1e8"/>

  </g>
  <text x="80" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="28" font-weight="700" fill="#f4f4f5" letter-spacing="-0.5">Gridsmith</text>
  <text x="80" y="62" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="11" fill="#71717a" letter-spacing="0.08em">PIXEL GRID → CRISP SVG</text>
</svg>
